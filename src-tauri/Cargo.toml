[package]
name = "dsh-desktop"
version = "0.3.0"
description = "DeepSeek Harness desktop wrapper"
authors = ["mijuu"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
portable-pty = "0.9.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
