[package]
name = "dsh-desktop"
version = "0.2.6"
description = "DeepSeek Harness desktop wrapper"
authors = ["mijuu"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
