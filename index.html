<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Desktop</title>
    <script>
      // Runs before the module/CSS paint: the same document serves the shell
      // window and the floating toolbar window (?view=bar). The class lets
      // CSS show exactly one of the two views with no flash.
      document.documentElement.classList.toggle(
        "view-bar",
        new URLSearchParams(location.search).get("view") === "bar",
      );
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="topbar" id="topbar">
      <div class="brand">
        <span class="title">DSH Desktop</span>
        <span class="version" id="version"></span>
      </div>
      <nav class="tabs">
        <button class="tab active" data-tab="app" data-i18n="tab.app">App</button>
        <button class="tab" data-tab="cli">CLI</button>
        <button class="tab" data-tab="plugins" data-i18n="tab.plugins">Plugins</button>
      </nav>
      <div class="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text" data-i18n="status.starting">Starting…</span>
      </div>
    </header>

    <main>
      <section class="panel active" id="panel-app">
        <div class="app-frame">
          <div class="loading" id="loading">
            <div class="spinner" id="loading-spinner"></div>
            <p id="loading-text" data-i18n="loading.starting">Starting dsh web…</p>
            <p class="hint" id="loading-hint" data-i18n="loading.hint" hidden>Check the CLI tab for detailed logs, then retry after fixing dependencies.</p>
            <button class="retry-btn" id="btn-retry" data-i18n="btn.retry" hidden>Retry</button>
            <button class="retry-btn" id="btn-nodejs" data-i18n="btn.nodejs" hidden>Open Node.js website</button>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-cli">
        <div class="cli-toolbar">
          <button id="btn-start" data-i18n="btn.start">Start</button>
          <button id="btn-stop" data-i18n="btn.stop">Stop</button>
          <button id="btn-restart" data-i18n="btn.restart">Restart</button>
          <button id="btn-upgrade" data-i18n="btn.upgrade">Upgrade</button>
          <span class="spacer"></span>
          <button id="btn-clear" data-i18n="btn.clear">Clear</button>
          <button id="btn-copy" data-i18n="btn.copy">Copy</button>
        </div>
        <div class="cli-term" id="cli-term"></div>
      </section>

      <section class="panel" id="panel-plugins">
        <div class="plugins-toolbar">
          <input
            type="text"
            id="plugin-name"
            data-i18n-placeholder="plugins.input"
            placeholder="Enter package, e.g. @scope/name or github:user/repo"
            spellcheck="false"
          />
          <button id="btn-add-plugin" data-i18n="btn.install">Install</button>
          <span class="spacer"></span>
          <button id="btn-refresh-plugins" data-i18n="btn.refresh">Refresh</button>
        </div>
        <div class="plugins-list" id="plugins-list"></div>
        <p class="plugins-hint" data-i18n="plugins.hint">Restart the service after installing / uninstalling plugins. Installation logs are in the CLI tab.</p>
      </section>
    </main>

    <!-- Floating toolbar window (index.html?view=bar): the only control
         surface while the main window shows the dsh app top-level. -->
    <div id="bar" data-tauri-drag-region>
      <span class="dot" id="bar-dot"></span>
      <span class="bar-status" id="bar-status" data-tauri-drag-region></span>
      <span class="bar-spacer"></span>
      <button id="bar-app" data-i18n="bar.app">App</button>
      <button id="bar-cli">CLI</button>
      <button id="bar-plugins" data-i18n="tab.plugins">Plugins</button>
      <button id="bar-restart" data-i18n="btn.restart">Restart</button>
      <button id="bar-stop" data-i18n="btn.stop">Stop</button>
      <button class="bar-close" id="bar-hide" data-i18n-title="bar.close" title="Hide toolbar">×</button>
    </div>
  </body>
</html>
