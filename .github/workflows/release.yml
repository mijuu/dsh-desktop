name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M1/M2/M3…)
            args: "--target aarch64-apple-darwin"
            artifact: "macos-aarch64"
          - platform: "macos-latest" # Intel Mac
            args: "--target x86_64-apple-darwin"
            artifact: "macos-x86_64"
          - platform: "windows-latest" # Windows x86_64 (NSIS + MSI)
            args: ""
            artifact: "windows-x86_64"
          - platform: "ubuntu-22.04" # Linux x86_64 (deb/rpm/AppImage)
            args: "--bundles deb,rpm,appimage"
            artifact: "linux-x86_64"
          - platform: "ubuntu-22.04-arm" # Linux aarch64 (deb/AppImage)
            args: "--bundles deb,appimage"
            artifact: "linux-aarch64"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only needed on macOS runners (arm + x86 cross targets)
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            # macOS jobs build with --target <triple>, so bundles land under
            # target/<triple>/release/bundle instead of target/release/bundle.
            src-tauri/target/*-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DSH Desktop ${{ github.ref_name }}"
          body: "See the assets to download and install this version."
          draft: true
          prerelease: false
          files: artifacts/**